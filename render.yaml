# API only. Create PostgreSQL as a separate Render resource, then paste
# its External Database URL into this service as DATABASE_URL.
# Do not commit the real connection string.

services:
  - type: web
    name: careertrack-api
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_MAX_CLIENTS
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
