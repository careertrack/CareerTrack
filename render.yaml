databases:
  - name: careertrack-db
    databaseName: careertrack
    user: careertrack

services:
  - type: web
    name: careertrack-api
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: careertrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
